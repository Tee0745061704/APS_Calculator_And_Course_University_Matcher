<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thembas Tracker - Login</title>
</head>
<body style="margin:0; background:#08080a; color:#ddd; font-family:monospace; padding:15px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">

    <div style="width:100%; max-width:400px; background:#141417; border:1px solid #222; padding:25px; border-radius:10px; border-top:1px solid #00ffff; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        
        <h1 style="text-align:center; color:#fff; font-size:22px; margin-bottom:5px; letter-spacing: 1px;">SYSTEM AUTH</h1>
        <p style="text-align:center; color:#00ffff; font-size:11px; margin-top:0; margin-bottom:25px;">APS CALCULATOR MODULE LOGIN</p>

        <!-- Main Authentication Form -->
        <form action="/login" method="POST" style="display:flex; flex-direction:column; gap:15px;">
            <div>
                <label style="color:#666; font-size:11px; display:block; margin-bottom:5px;">USERNAME :</label>
                <input type="text" name="username" placeholder="Enter username" required style="width:100%; padding:12px; background:#0a0a0c; border:1px solid #333; color:#fff; border-radius:5px; font-family:monospace; box-sizing: border-box; font-size:14px;">
            </div>
            
            <div>
                <label style="color:#666; font-size:11px; display:block; margin-bottom:5px;">SECURITY ACCESS KEY :</label>
                <input type="password" name="password" placeholder="Enter password" required style="width:100%; padding:12px; background:#0a0a0c; border:1px solid #333; color:#fff; border-radius:5px; font-family:monospace; box-sizing: border-box; font-size:14px;">
            </div>

            <button type="submit" style="width:100%; background:#00ffff; border:none; padding:12px; border-radius:5px; font-weight:bold; cursor:pointer; font-family:monospace; color:#000; font-size:14px; margin-top:10px; letter-spacing:1px;">INITIALIZE LOGIN</button>
        </form>

        <p style="text-align:center; font-size:12px; margin-top:20px; color:#888;">
            New student tracker? <a href="/register" style="color:#a855f7; text-decoration:none; font-weight:bold;">Create account ledger</a>
        </p>

        <!-- CRUCIAL PUBLIC TOUR INSTRUCTION BLOCK -->
        <div style="margin-top:25px; background:#0a0a0c; border:1px solid #331a4a; padding:15px; border-radius:6px; box-sizing: border-box; border-left:3px solid #a855f7;">
            <p style="color:#a855f7; font-size:11px; margin:0 0 5px 0; font-weight:bold; letter-spacing:1px;"> PUBLIC PREVIEW HUB :</p>
            <p style="color:#b8f5ff; font-size:12px; margin:0; line-height:1.5;">
                To view a fully populated live dashboard demo before registering, type <strong style="color:#fff; background:#222; padding:2px 5px; border-radius:3px;">Themba</strong> into the username box and enter <strong style="color:#fff; background:#222; padding:2px 5px; border-radius:3px;">any password</strong> to instantly launch preview mode!
            </p>
        </div>

    </div>

</body>
</html>
